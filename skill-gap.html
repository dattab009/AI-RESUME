<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Skill Gap Analyzer</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #050816,
                    #111827,
                    #312e81
                );

        }

        nav {

            height: 70px;

            padding: 0 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                rgba(5,8,22,0.85);

            border-bottom:
                1px solid
                rgba(255,255,255,0.1);

        }

        .logo {

            font-size: 22px;

            font-weight: bold;

        }

        .logo span {

            color: #22d3ee;

        }

        .back-btn {

            padding: 9px 16px;

            border-radius: 8px;

            border: 1px solid
                rgba(255,255,255,0.15);

            background:
                rgba(255,255,255,0.05);

            color: white;

            cursor: pointer;

        }

        main {

            width: 90%;

            max-width: 1100px;

            margin: auto;

            padding: 50px 0;

        }

        h1 {

            font-size: 38px;

            margin-bottom: 10px;

        }

        h1 span {

            color: #22d3ee;

        }

        .subtitle {

            color: #94a3b8;

            margin-bottom: 30px;

        }

        .card {

            padding: 30px;

            border-radius: 20px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid
                rgba(255,255,255,0.1);

            margin-bottom: 25px;

        }

        select {

            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border: 1px solid
                rgba(255,255,255,0.15);

            background: #111827;

            color: white;

            outline: none;

            font-size: 15px;

        }

        .analyze-btn {

            margin-top: 20px;

            padding: 13px 25px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #06b6d4,
                    #7c3aed
                );

            color: white;

            font-weight: bold;

            cursor: pointer;

        }

        .result {

            display: none;

        }

        .summary {

            display: grid;

            grid-template-columns:
                repeat(
                    3,
                    1fr
                );

            gap: 15px;

            margin: 25px 0;

        }

        .summary-card {

            padding: 20px;

            border-radius: 15px;

            background:
                rgba(255,255,255,0.05);

            text-align: center;

        }

        .number {

            font-size: 32px;

            font-weight: bold;

            color: #22d3ee;

            margin-top: 10px;

        }

        .skills {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 15px;

        }

        .skill {

            padding: 8px 14px;

            border-radius: 20px;

            background:
                rgba(34,211,238,0.12);

            border: 1px solid
                rgba(34,211,238,0.3);

            color: #67e8f9;

        }

        .missing {

            background:
                rgba(248,113,113,0.12);

            border-color:
                rgba(248,113,113,0.3);

            color: #fca5a5;

        }

        .roadmap {

            margin-top: 30px;

        }

        .roadmap-item {

            padding: 20px;

            margin-top: 15px;

            border-radius: 15px;

            background:
                rgba(255,255,255,0.05);

            border-left:
                4px solid #22d3ee;

        }

        .roadmap-item h3 {

            margin-bottom: 8px;

        }

        .roadmap-item p {

            color: #94a3b8;

            line-height: 1.6;

        }

        #message {

            margin-top: 15px;

        }

        @media(max-width:700px) {

            .summary {

                grid-template-columns:
                    1fr;

            }

            h1 {

                font-size: 30px;

            }

        }

    </style>

</head>


<body>


<nav>

    <div class="logo">

        🤖 AI
        <span>CareerCopilot</span>

    </div>


    <button
        class="back-btn"
        onclick="goDashboard()">

        ← Dashboard

    </button>

</nav>


<main>


    <h1>

        AI <span>Skill Gap Analyzer</span>

    </h1>


    <p class="subtitle">

        Discover the skills you need to learn
        for your target career.

    </p>


    <section class="card">

        <h2>

            🎯 Select Target Career

        </h2>

        <br>


        <select id="career">

            <option value="java">

                Java Full Stack Developer

            </option>

            <option value="frontend">

                Frontend Developer

            </option>

            <option value="python">

                Python Developer

            </option>

            <option value="aiml">

                AI / ML Engineer

            </option>

            <option value="data">

                Data Analyst

            </option>

        </select>


        <button
            class="analyze-btn"
            id="analyzeBtn">

            🧠 Analyze Skill Gap

        </button>


        <div id="message"></div>

    </section>


    <section
        class="card result"
        id="result">


        <h2>

            📊 Your Skill Gap

        </h2>


        <div class="summary">


            <div class="summary-card">

                <p>
                    Your Skills
                </p>

                <div
                    class="number"
                    id="yourCount">

                    0

                </div>

            </div>


            <div class="summary-card">

                <p>
                    Required Skills
                </p>

                <div
                    class="number"
                    id="requiredCount">

                    0

                </div>

            </div>


            <div class="summary-card">

                <p>
                    Skills To Learn
                </p>

                <div
                    class="number"
                    id="missingCount">

                    0

                </div>

            </div>


        </div>


        <h3>

            ⚠️ Missing Skills

        </h3>


        <div
            class="skills"
            id="missingSkills">

        </div>


        <div class="roadmap">

            <h2>

                🗺️ Learning Roadmap

            </h2>


            <div
                id="roadmap">

            </div>

        </div>


    </section>


</main>


<script>


const analyzeBtn =
    document.getElementById(
        "analyzeBtn"
    );


const career =
    document.getElementById(
        "career"
    );


const result =
    document.getElementById(
        "result"
    );


const message =
    document.getElementById(
        "message"
    );


const yourCount =
    document.getElementById(
        "yourCount"
    );


const requiredCount =
    document.getElementById(
        "requiredCount"
    );


const missingCount =
    document.getElementById(
        "missingCount"
    );


const missingSkills =
    document.getElementById(
        "missingSkills"
    );


const roadmap =
    document.getElementById(
        "roadmap"
    );



const careerSkills = {


    java: [

        "Java",

        "Spring Boot",

        "HTML",

        "CSS",

        "JavaScript",

        "React",

        "Node.js",

        "MongoDB",

        "SQL",

        "Git"

    ],


    frontend: [

        "HTML",

        "CSS",

        "JavaScript",

        "React",

        "Git",

        "GitHub",

        "Responsive Design",

        "REST API"

    ],


    python: [

        "Python",

        "Django",

        "Flask",

        "SQL",

        "Git",

        "REST API",

        "HTML",

        "CSS"

    ],


    aiml: [

        "Python",

        "NumPy",

        "Pandas",

        "Scikit-learn",

        "Machine Learning",

        "Deep Learning",

        "SQL",

        "Git"

    ],


    data: [

        "Python",

        "Excel",

        "SQL",

        "Pandas",

        "NumPy",

        "Power BI",

        "Data Analysis",

        "Statistics"

    ]

};



const learningMap = {


    "Java": 
        "Learn Java fundamentals, OOP, collections and exception handling.",

    "Spring Boot":
        "Learn REST APIs, dependency injection and Spring Boot project development.",

    "React":
        "Learn components, props, state, hooks and API integration.",

    "MongoDB":
        "Learn collections, documents, CRUD operations and MongoDB queries.",

    "SQL":
        "Learn SELECT, JOIN, GROUP BY, subqueries and database design.",

    "Git":
        "Learn Git commands, branching, commits and GitHub workflow.",

    "Python":
        "Learn Python syntax, functions, OOP and file handling.",

    "Django":
        "Learn Django models, views, URLs and REST APIs.",

    "Flask":
        "Learn Flask routing, APIs and backend development.",

    "NumPy":
        "Learn arrays, indexing and numerical operations.",

    "Pandas":
        "Learn DataFrames, data cleaning and data analysis.",

    "Scikit-learn":
        "Learn ML preprocessing, training and model evaluation.",

    "Machine Learning":
        "Learn regression, classification, clustering and model evaluation.",

    "Deep Learning":
        "Learn neural networks and deep learning fundamentals.",

    "Excel":
        "Learn formulas, pivot tables, charts and data cleaning.",

    "Power BI":
        "Learn dashboards, data modeling and interactive reports.",

    "Statistics":
        "Learn mean, median, probability, distributions and hypothesis testing."

};



analyzeBtn.addEventListener(
    "click",
    function() {


        const selectedCareer =
            career.value;


        const required =
            careerSkills[
                selectedCareer
            ];


        const resumeSkills =
            JSON.parse(
                localStorage.getItem(
                    "resumeSkills"
                ) || "[]"
            );


        const normalizedResume =
            resumeSkills.map(
                function(skill) {

                    return skill
                        .toLowerCase();

                }
            );


        const missing = [];


        required.forEach(
            function(skill) {

                if (
                    !normalizedResume.includes(
                        skill.toLowerCase()
                    )
                ) {

                    missing.push(skill);

                }

            }
        );


        yourCount.innerText =
            resumeSkills.length;


        requiredCount.innerText =
            required.length;


        missingCount.innerText =
            missing.length;


        missingSkills.innerHTML =
            "";


        roadmap.innerHTML =
            "";


        missing.forEach(
            function(skill) {


                const skillElement =
                    document.createElement(
                        "div"
                    );


                skillElement.className =
                    "skill missing";


                skillElement.innerText =
                    "⚠ " + skill;


                missingSkills.appendChild(
                    skillElement
                );


                const roadmapItem =
                    document.createElement(
                        "div"
                    );


                roadmapItem.className =
                    "roadmap-item";


                const explanation =
                    learningMap[skill] ||
                    "Learn the fundamentals and build a practical project using this skill.";


                roadmapItem.innerHTML = `

                    <h3>
                        📚 ${skill}
                    </h3>

                    <p>
                        ${explanation}
                    </p>

                `;


                roadmap.appendChild(
                    roadmapItem
                );

            }
        );


        result.style.display =
            "block";


        message.style.color =
            "#22c55e";


        message.innerText =
            "✅ Skill gap analysis completed.";

    }
);



function goDashboard() {

    window.location.href =
        "dashboard.html";

}


</script>


</body>

</html>
