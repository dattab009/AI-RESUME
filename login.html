<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | AI CareerCopilot</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #050816,
                    #172554,
                    #312e81
                );

            color: white;

            padding: 20px;
        }

        .login-box {

            width: 100%;

            max-width: 450px;

            padding: 40px;

            border-radius: 25px;

            background:
                rgba(255,255,255,0.08);

            border:
                1px solid rgba(255,255,255,0.15);

            backdrop-filter: blur(20px);

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.4);
        }

        .logo {

            text-align: center;

            font-size: 55px;

            margin-bottom: 10px;
        }

        h1 {

            text-align: center;

            margin-bottom: 10px;
        }

        .subtitle {

            text-align: center;

            color: #94a3b8;

            margin-bottom: 30px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            color: #cbd5e1;

            font-size: 14px;
        }

        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 18px;

            border-radius: 10px;

            border:
                1px solid
                rgba(255,255,255,0.15);

            background:
                rgba(255,255,255,0.06);

            color: white;

            outline: none;

            font-size: 15px;
        }

        input:focus {

            border-color: #22d3ee;

            box-shadow:
                0 0 10px
                rgba(34,211,238,0.15);
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            color: white;

            font-weight: bold;

            font-size: 16px;

            cursor: pointer;

            background:
                linear-gradient(
                    90deg,
                    #06b6d4,
                    #7c3aed
                );
        }

        button:hover {

            transform: translateY(-2px);
        }

        #message {

            text-align: center;

            margin-top: 18px;

            min-height: 22px;
        }

        .register-link {

            text-align: center;

            margin-top: 22px;

            color: #94a3b8;
        }

        .register-link a {

            color: #22d3ee;

            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="login-box">


    <div class="logo">
        🤖
    </div>


    <h1>
        Welcome Back
    </h1>


    <p class="subtitle">
        Login to your AI CareerCopilot
    </p>


    <form id="loginForm">

    <input
        type="email"
        id="email"
        placeholder="Email"
        required
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
        required
    >

    <button type="submit">
        Login
    </button>

</form>


    


    <div id="message"></div>


    <div class="register-link">

        Don't have an account?

        <a href="register.html">
            Create Account
        </a>

    </div>


</div>





<script>

const form =
    document.getElementById(
        "loginForm"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document.getElementById(
                "email"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        const message =
            document.getElementById(
                "message"
            );


        message.style.color =
            "#22d3ee";

        message.innerText =
            "⏳ Logging in...";


        try {

            const response =
                await fetch(
                    "/api/auth/login",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                email:
                                    email,

                                password:
                                    password

                            })

                    }
                );


            const data =
                await response.json();


            if (data.success) {

                localStorage.setItem(
                    "token",
                    data.token
                );


                localStorage.setItem(
                    "user",
                    JSON.stringify(
                        data.user
                    )
                );


                message.style.color =
                    "#22c55e";


                message.innerText =
                    "✅ Login successful!";


                setTimeout(
                    () => {

                        window.location.href =
                            "dashboard.html";

                    },
                    1000
                );


            } else {

                message.style.color =
                    "#f87171";


                message.innerText =
                    "❌ " +
                    data.message;

            }


        } catch (error) {

            console.error(error);


            message.style.color =
                "#f87171";


            message.innerText =
                "🔴 Backend connection failed";

        }

    }
);

</script>


</body>

</html>
