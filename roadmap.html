<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Career Roadmap</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #050816,
                    #111827,
                    #312e81
                );

        }

        nav {

            height: 70px;

            padding: 0 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                rgba(5,8,22,0.85);

            border-bottom:
                1px solid
                rgba(255,255,255,0.1);

        }

        .logo {

            font-size: 22px;

            font-weight: bold;

        }

        .logo span {

            color: #22d3ee;

        }

        .back-btn {

            padding: 9px 16px;

            border-radius: 8px;

            border: 1px solid
                rgba(255,255,255,0.15);

            background:
                rgba(255,255,255,0.05);

            color: white;

            cursor: pointer;

        }

        main {

            width: 90%;

            max-width: 1100px;

            margin: auto;

            padding: 50px 0;

        }

        h1 {

            font-size: 38px;

            margin-bottom: 10px;

        }

        h1 span {

            color: #22d3ee;

        }

        .subtitle {

            color: #94a3b8;

            margin-bottom: 30px;

        }

        .card {

            padding: 30px;

            border-radius: 20px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid
                rgba(255,255,255,0.1);

            margin-bottom: 25px;

        }

        select {

            width: 100%;

            padding: 14px;

            border-radius: 10px;

            border: 1px solid
                rgba(255,255,255,0.15);

            background: #111827;

            color: white;

            font-size: 15px;

            outline: none;

        }

        .generate-btn {

            margin-top: 20px;

            padding: 13px 25px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #06b6d4,
                    #7c3aed
                );

            color: white;

            font-weight: bold;

            cursor: pointer;

        }

        .result {

            display: none;

        }

        .career-title {

            font-size: 28px;

            color: #22d3ee;

            margin-bottom: 25px;

        }

        .timeline {

            position: relative;

            margin-top: 25px;

        }

        .timeline-item {

            position: relative;

            padding: 25px;

            margin-bottom: 20px;

            border-radius: 15px;

            background:
                rgba(255,255,255,0.05);

            border-left:
                4px solid #22d3ee;

        }

        .timeline-item h3 {

            margin-bottom: 12px;

        }

        .timeline-item p {

            color: #94a3b8;

            line-height: 1.7;

        }

        .tag-container {

            display: flex;

            flex-wrap: wrap;

            gap: 10px;

            margin-top: 15px;

        }

        .tag {

            padding: 8px 13px;

            border-radius: 20px;

            background:
                rgba(34,211,238,0.12);

            color: #67e8f9;

            border:
                1px solid
                rgba(34,211,238,0.3);

        }

        .project {

            margin-top: 12px;

            padding: 15px;

            border-radius: 10px;

            background:
                rgba(124,58,237,0.12);

            border:
                1px solid
                rgba(124,58,237,0.25);

        }

        .interview {

            margin-top: 25px;

            padding: 20px;

            border-radius: 15px;

            background:
                rgba(34,197,94,0.08);

            border:
                1px solid
                rgba(34,197,94,0.25);

        }

        @media(max-width:700px) {

            h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>


<nav>

    <div class="logo">

        🤖 AI
        <span>CareerCopilot</span>

    </div>


    <button
        class="back-btn"
        onclick="goDashboard()">

        ← Dashboard

    </button>

</nav>


<main>


    <h1>

        🗺️ AI <span>Career Roadmap</span>

    </h1>


    <p class="subtitle">

        Get a personalized learning path
        for your target career.

    </p>


    <section class="card">

        <h2>

            🎯 Select Your Career

        </h2>

        <br>


        <select id="career">

            <option value="java">

                Java Full Stack Developer

            </option>

            <option value="frontend">

                Frontend Developer

            </option>

            <option value="python">

                Python Developer

            </option>

            <option value="aiml">

                AI / ML Engineer

            </option>

            <option value="data">

                Data Analyst

            </option>

        </select>


        <button
            class="generate-btn"
            id="generateBtn">

            🚀 Generate Career Roadmap

        </button>

    </section>



    <section
        class="card result"
        id="result">

        <div
            class="career-title"
            id="careerTitle">

        </div>


        <div
            class="timeline"
            id="timeline">

        </div>


        <div
            class="interview">

            <h2>

                🎤 Interview Preparation

            </h2>

            <br>

            <p>

                After completing the roadmap,
                practice technical questions,
                HR questions and project-based
                interview questions.

            </p>

        </div>

    </section>


</main>



<script>


const career =
    document.getElementById(
        "career"
    );


const generateBtn =
    document.getElementById(
        "generateBtn"
    );


const result =
    document.getElementById(
        "result"
    );


const careerTitle =
    document.getElementById(
        "careerTitle"
    );


const timeline =
    document.getElementById(
        "timeline"
    );



const roadmaps = {


    java: {

        title:
            "☕ Java Full Stack Developer",

        months: [

            {

                title:
                    "Month 1 — Java Fundamentals",

                description:
                    "Learn Java syntax, OOP, classes, objects, inheritance, interfaces, collections and exception handling.",

                skills: [
                    "Java",
                    "OOP",
                    "Collections",
                    "Exception Handling"
                ],

                project:
                    "Build a Student Management System using Java."

            },


            {

                title:
                    "Month 2 — Backend + Database",

                description:
                    "Learn Spring Boot, REST APIs, SQL, MongoDB and backend architecture.",

                skills: [
                    "Spring Boot",
                    "REST API",
                    "SQL",
                    "MongoDB"
                ],

                project:
                    "Build a College Management REST API."

            },


            {

                title:
                    "Month 3 — Frontend + Full Stack",

                description:
                    "Connect frontend with backend and build authentication, dashboards and CRUD operations.",

                skills: [
                    "HTML",
                    "CSS",
                    "JavaScript",
                    "React",
                    "Git"
                ],

                project:
                    "Build a complete AI Career Management Platform."

            }

        ]

    },


    frontend: {

        title:
            "🎨 Frontend Developer",

        months: [

            {

                title:
                    "Month 1 — Web Fundamentals",

                description:
                    "Master HTML, CSS, responsive layouts, Flexbox, Grid and basic JavaScript.",

                skills: [
                    "HTML",
                    "CSS",
                    "JavaScript"
                ],

                project:
                    "Build a responsive personal portfolio."

            },


            {

                title:
                    "Month 2 — Modern Frontend",

                description:
                    "Learn JavaScript DOM, APIs, asynchronous programming and React fundamentals.",

                skills: [
                    "DOM",
                    "REST API",
                    "React",
                    "Git"
                ],

                project:
                    "Build an AI-powered job search dashboard."

            },


            {

                title:
                    "Month 3 — Advanced Projects",

                description:
                    "Build responsive production-style interfaces and connect them with APIs.",

                skills: [
                    "React",
                    "API Integration",
                    "GitHub"
                ],

                project:
                    "Build a complete CareerCopilot frontend."

            }

        ]

    },


    python: {

        title:
            "🐍 Python Developer",

        months: [

            {

                title:
                    "Month 1 — Python",

                description:
                    "Learn Python syntax, functions, lists, dictionaries, OOP and file handling.",

                skills: [
                    "Python",
                    "OOP",
                    "File Handling"
                ],

                project:
                    "Build a Student Record Management System."

            },


            {

                title:
                    "Month 2 — Backend",

                description:
                    "Learn Flask, REST APIs, databases and authentication.",

                skills: [
                    "Flask",
                    "REST API",
                    "SQL",
                    "MongoDB"
                ],

                project:
                    "Build a Resume Analyzer API."

            },


            {

                title:
                    "Month 3 — Deployment",

                description:
                    "Connect frontend and backend and deploy your application.",

                skills: [
                    "API Integration",
                    "Git",
                    "Deployment"
                ],

                project:
                    "Build and deploy a complete Python web application."

            }

        ]

    },


    aiml: {

        title:
            "🤖 AI / ML Engineer",

        months: [

            {

                title:
                    "Month 1 — Python + Data",

                description:
                    "Learn Python and data manipulation libraries.",

                skills: [
                    "Python",
                    "NumPy",
                    "Pandas"
                ],

                project:
                    "Build a Student Performance Analysis project."

            },


            {

                title:
                    "Month 2 — Machine Learning",

                description:
                    "Learn regression, classification, preprocessing and model evaluation.",

                skills: [
                    "Machine Learning",
                    "Scikit-learn",
                    "Statistics"
                ],

                project:
                    "Build a Student Performance Prediction model."

            },


            {

                title:
                    "Month 3 — AI Application",

                description:
                    "Connect an ML model with a web application and create a practical AI solution.",

                skills: [
                    "Flask",
                    "ML API",
                    "Model Deployment"
                ],

                project:
                    "Build an AI Resume Analyzer."

            }

        ]

    },


    data: {

        title:
            "📊 Data Analyst",

        months: [

            {

                title:
                    "Month 1 — Excel + Statistics",

                description:
                    "Learn Excel formulas, pivot tables, charts and basic statistics.",

                skills: [
                    "Excel",
                    "Statistics"
                ],

                project:
                    "Build a Student Performance Dashboard."

            },


            {

                title:
                    "Month 2 — SQL + Python",

                description:
                    "Learn SQL queries and Python-based data analysis.",

                skills: [
                    "SQL",
                    "Python",
                    "Pandas",
                    "NumPy"
                ],

                project:
                    "Analyze a college student dataset."

            },


            {

                title:
                    "Month 3 — Power BI",

                description:
                    "Create interactive dashboards and communicate insights from data.",

                skills: [
                    "Power BI",
                    "Data Visualization",
                    "Data Analysis"
                ],

                project:
                    "Build an interactive college analytics dashboard."

            }

        ]

    }

};



generateBtn.addEventListener(
    "click",
    function() {


        const selected =
            career.value;


        const roadmapData =
            roadmaps[selected];


        careerTitle.innerText =
            roadmapData.title;


        timeline.innerHTML =
            "";


        roadmapData.months.forEach(
            function(month) {


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "timeline-item";


                let skillHTML = "";


                month.skills.forEach(
                    function(skill) {

                        skillHTML +=
                            `<span class="tag">
                                ${skill}
                             </span>`;

                    }
                );


                item.innerHTML = `

                    <h3>
                        ${month.title}
                    </h3>

                    <p>
                        ${month.description}
                    </p>

                    <div class="tag-container">

                        ${skillHTML}

                    </div>

                    <div class="project">

                        🚀 <strong>
                        Project:
                        </strong>

                        ${month.project}

                    </div>

                `;


                timeline.appendChild(
                    item
                );

            }
        );


        result.style.display =
            "block";


        result.scrollIntoView({
            behavior: "smooth"
        });

    }
);



function goDashboard() {

    window.location.href =
        "dashboard.html";

}


</script>


</body>

</html>
