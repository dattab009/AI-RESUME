<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Career Report</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #050816,
                    #111827,
                    #312e81
                );

        }

        nav {

            height: 70px;

            padding: 0 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                rgba(5,8,22,0.9);

            border-bottom:
                1px solid
                rgba(255,255,255,0.1);

        }

        .logo {

            font-size: 22px;

            font-weight: bold;

        }

        .logo span {

            color: #22d3ee;

        }

        .back-btn {

            padding: 9px 16px;

            border-radius: 8px;

            border: 1px solid
                rgba(255,255,255,0.15);

            background:
                rgba(255,255,255,0.05);

            color: white;

            cursor: pointer;

        }

        main {

            width: 90%;

            max-width: 1100px;

            margin: auto;

            padding: 50px 0;

        }

        h1 {

            font-size: 38px;

            margin-bottom: 10px;

        }

        h1 span {

            color: #22d3ee;

        }

        .subtitle {

            color: #94a3b8;

            margin-bottom: 30px;

        }

        .report-grid {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 18px;

            margin-bottom: 25px;

        }

        .score-card {

            padding: 25px;

            border-radius: 18px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid
                rgba(255,255,255,0.1);

            text-align: center;

        }

        .score-card h3 {

            color: #cbd5e1;

            font-size: 15px;

        }

        .score {

            font-size: 40px;

            font-weight: bold;

            color: #22d3ee;

            margin-top: 15px;

        }

        .card {

            padding: 30px;

            border-radius: 20px;

            background:
                rgba(255,255,255,0.07);

            border:
                1px solid
                rgba(255,255,255,0.1);

            margin-bottom: 25px;

        }

        .progress-box {

            margin-top: 20px;

        }

        .progress-label {

            display: flex;

            justify-content: space-between;

            margin-bottom: 8px;

        }

        .progress-bar {

            height: 12px;

            width: 100%;

            border-radius: 20px;

            background:
                rgba(255,255,255,0.1);

            overflow: hidden;

        }

        .progress {

            height: 100%;

            width: 0%;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    #06b6d4,
                    #7c3aed
                );

            transition:
                width 1s ease;

        }

        .status {

            padding: 20px;

            border-radius: 15px;

            margin-top: 20px;

            background:
                rgba(34,211,238,0.08);

            border:
                1px solid
                rgba(34,211,238,0.2);

        }

        .recommendations {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 15px;

            margin-top: 20px;

        }

        .recommendation {

            padding: 20px;

            border-radius: 15px;

            background:
                rgba(255,255,255,0.05);

            border:
                1px solid
                rgba(255,255,255,0.08);

        }

        .recommendation h3 {

            margin-bottom: 10px;

            color: #67e8f9;

        }

        .recommendation p {

            color: #94a3b8;

            line-height: 1.6;

        }

        .print-btn {

            margin-top: 10px;

            padding: 13px 25px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    90deg,
                    #06b6d4,
                    #7c3aed
                );

            color: white;

            font-weight: bold;

            cursor: pointer;

        }

        @media(max-width:900px) {

            .report-grid {

                grid-template-columns:
                    repeat(2, 1fr);

            }

        }

        @media(max-width:600px) {

            .report-grid,
            .recommendations {

                grid-template-columns: 1fr;

            }

            h1 {

                font-size: 30px;

            }

        }

        @media print {

            nav,
            .print-btn {

                display: none;

            }

            body {

                background: white;

                color: black;

            }

            .card,
            .score-card {

                border: 1px solid #ddd;

                background: white;

            }

        }

    </style>

</head>


<body>


<nav>

    <div class="logo">

        🤖 AI
        <span>CareerCopilot</span>

    </div>


    <button
        class="back-btn"
        onclick="goDashboard()">

        ← Dashboard

    </button>

</nav>


<main>


    <h1>

        📊 AI <span>Career Report</span>

    </h1>


    <p class="subtitle">

        Your complete career readiness overview.

    </p>


    <!-- SCORE CARDS -->

    <section class="report-grid">


        <div class="score-card">

            <h3>
                Resume Score
            </h3>

            <div
                class="score"
                id="resumeScore">

                0%

            </div>

        </div>


        <div class="score-card">

            <h3>
                Job Match
            </h3>

            <div
                class="score"
                id="jobScore">

                0%

            </div>

        </div>


        <div class="score-card">

            <h3>
                Skill Gap
            </h3>

            <div
                class="score"
                id="skillScore">

                0

            </div>

        </div>


        <div class="score-card">

            <h3>
                Interview
            </h3>

            <div
                class="score"
                id="interviewScore">

                0/10

            </div>

        </div>


    </section>


    <!-- CAREER READINESS -->

    <section class="card">

        <h2>
            🎯 Career Readiness
        </h2>


        <div class="progress-box">

            <div class="progress-label">

                <span>
                    Overall Readiness
                </span>

                <span
                    id="readinessText">
                    0%
                </span>

            </div>


            <div class="progress-bar">

                <div
                    class="progress"
                    id="readinessBar">

                </div>

            </div>

        </div>


        <div
            class="status"
            id="status">

            Analyzing your career profile...

        </div>

    </section>


    <!-- RECOMMENDATIONS -->

    <section class="card">

        <h2>
            💡 Recommendations
        </h2>


        <div
            class="recommendations"
            id="recommendations">

        </div>


        <button
            class="print-btn"
            onclick="window.print()">

            🖨️ Print / Save Report

        </button>

    </section>


</main>



<script>


/*
    Default demo values.

    Later these will come from
    MongoDB / backend APIs.
*/


let resumeScore =
    Number(
        localStorage.getItem(
            "resumeScore"
        ) || 70
    );


let jobScore =
    Number(
        localStorage.getItem(
            "jobMatchScore"
        ) || 60
    );


let skillGap =
    Number(
        localStorage.getItem(
            "skillGap"
        ) || 4
    );


let interviewScore =
    Number(
        localStorage.getItem(
            "interviewScore"
        ) || 6
    );



document.getElementById(
    "resumeScore"
).innerText =
    resumeScore + "%";


document.getElementById(
    "jobScore"
).innerText =
    jobScore + "%";


document.getElementById(
    "skillScore"
).innerText =
    skillGap;


document.getElementById(
    "interviewScore"
).innerText =
    interviewScore + "/10";



/*
    Convert interview score
    from 10 to 100.
*/


const interviewPercentage =
    interviewScore * 10;



/*
    Skill gap contribution.

    Fewer missing skills =
    higher score.
*/


let skillPercentage =
    Math.max(
        0,
        100 -
        (skillGap * 10)
    );



/*
    Overall readiness
*/


const readiness =
    Math.round(

        (
            resumeScore +
            jobScore +
            skillPercentage +
            interviewPercentage
        ) / 4

    );



document.getElementById(
    "readinessText"
).innerText =
    readiness + "%";


setTimeout(
    function() {

        document.getElementById(
            "readinessBar"
        ).style.width =
            readiness + "%";

    },
    300
);



/*
    Career status
*/


const status =
    document.getElementById(
        "status"
    );


if (readiness >= 80) {

    status.innerText =
        "🚀 Your profile shows strong career readiness. Continue improving through projects and interview practice.";

}

else if (readiness >= 60) {

    status.innerText =
        "📈 Your profile is progressing. Focus on missing skills, projects and interview preparation.";

}

else {

    status.innerText =
        "🎯 Focus on building your technical skills, improving your resume and practicing interviews.";

}



/*
    Recommendations
*/


const recommendations =
    document.getElementById(
        "recommendations"
    );


const items = [];



if (resumeScore < 80) {

    items.push({

        title:
            "📄 Improve Resume",

        text:
            "Add measurable project achievements, technical skills and relevant keywords to your resume."

    });

}



if (jobScore < 70) {

    items.push({

        title:
            "💼 Improve Job Match",

        text:
            "Compare your skills with job descriptions and learn the skills frequently requested by employers."

    });

}



if (skillGap > 0) {

    items.push({

        title:
            "🧠 Close Skill Gap",

        text:
            "Follow your career roadmap and build practical projects using the missing technologies."

    });

}



if (interviewScore < 8) {

    items.push({

        title:
            "🎤 Practice Interviews",

        text:
            "Practice technical and project-based questions and improve the clarity of your answers."

    });

}



items.push({

    title:
        "🚀 Build Projects",

    text:
        "Create 2–3 practical projects and publish them on GitHub with clear documentation."

});



items.forEach(
    function(item) {

        const div =
            document.createElement(
                "div"
            );


        div.className =
            "recommendation";


        div.innerHTML = `

            <h3>
                ${item.title}
            </h3>

            <p>
                ${item.text}
            </p>

        `;


        recommendations.appendChild(
            div
        );

    }
);



function goDashboard() {

    window.location.href =
        "dashboard.html";

}


</script>


</body>

</html>
